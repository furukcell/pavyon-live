<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#160d18" />
    <meta name="description" content="PAVYON LIVE - interaktif 3D pavyon oyun prototipi" />
    <title>PAVYON LIVE</title>
  </head>
  <body>
    <main id="game-shell">
      <canvas id="game-canvas" aria-label="Pavyon Live 3D oyun sahnesi"></canvas>
      <section class="hud">
        <header class="topbar">
          <div><span class="eyebrow">CANLI ETKİLEŞİM SİMÜLATÖRÜ</span><h1>PAVYON <em>LIVE</em></h1></div>
          <div class="live-pill"><span></span> TEST YAYINI</div>
        </header>
        <div class="status-row">
          <div class="stat"><small>MEKÂNDA</small><strong id="guest-count">0 / 100</strong></div>
          <div class="stat"><small>KONS</small><strong id="kons-count">10 müsait</strong></div>
          <div class="stat"><small>BEĞENİ</small><strong id="like-count">0</strong></div>
        </div>
        <div class="bottom-grid">
          <section class="panel command-panel">
            <div class="panel-heading"><span>ETKİLEŞİM AKIŞI</span><span class="muted">TEST</span></div>
            <div id="event-log" class="event-log"><p class="empty">Henüz etkileşim yok.</p></div>
          </section>
          <section class="panel controls">
            <div class="panel-heading">İZLEYİCİ TEST PANELİ</div>
            <label>Test kullanıcı adı<input id="username" maxlength="20" value="misafir_01" autocomplete="off" /></label>
            <div class="button-grid">
              <button data-command="!gel">+ Mekâna gel</button><button data-command="!dans">Dans et</button>
              <button data-command="!masa">Masaya otur</button><button data-command="!sahne">Sahneye çık</button>
            </div>
            <div class="divider"></div>
            <label>Hedef kons<select id="kons-select"><option value="kons-1">Kons 1</option><option value="kons-2">Kons 2</option><option value="kons-3">Kons 3</option><option value="kons-4">Kons 4</option><option value="kons-5">Kons 5</option><option value="kons-6">Kons 6</option><option value="kons-7">Kons 7</option><option value="kons-8">Kons 8</option><option value="kons-9">Kons 9</option><option value="kons-10">Kons 10</option></select></label>
            <div class="button-grid gifts">
              <button data-gift="invite">🌹 Masaya davet</button><button data-gift="dance">💃 Birlikte dans</button>
              <button data-gift="drink">🥤 İçecek gönder</button><button data-gift="vip">⭐ VIP daveti</button>
              <button data-gift="stage">🎤 Sahne gösterisi</button>
            </div>
            <button id="like-button" class="like-button">♥ Beğeni gönder</button>
          </section>
        </div>
        <footer>Geliştirme simülatörü · Gerçek TikTok LIVE bağlantısı henüz etkin değil</footer>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
