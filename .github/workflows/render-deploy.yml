name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pavyon-live-render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Explain skipped deployment
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "Skipped: add the RENDER_DEPLOY_HOOK_URL repository Actions secret to enable Render deployments."
